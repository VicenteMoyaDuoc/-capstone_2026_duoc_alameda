<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="iniciarSesion()">
    <span class="marca-icono"><i class="pi pi-qrcode"></i></span>
    <h1>Registrapp</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <p-password
        id="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
      />
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }

    <button pButton type="submit" label="Ingresar" [loading]="cargando()" class="boton-ingresar"></button>
  </form>
</div>
