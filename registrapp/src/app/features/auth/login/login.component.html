<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="iniciarSesion()">
    <span class="marca-icono"><i class="pi pi-qrcode"></i></span>
    <h1>Registrapp</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="campo">
      <div class="campo-encabezado">
        <label for="password">Contraseña</label>
        <a routerLink="/recuperar" class="enlace-sutil">¿Olvidaste tu contraseña?</a>
      </div>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
      />
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }

    <button
      pButton
      type="submit"
      [loading]="cargando()"
      [disabled]="cargando()"
      class="boton-ingresar"
    >Ingresar</button>

    <p class="pie">
      ¿Nueva institución?
      <a routerLink="/registro">Regístrala aquí</a>
    </p>
  </form>
</div>
