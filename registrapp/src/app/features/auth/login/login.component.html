<div class="login">
  <aside class="panel-marca">
    <img class="escena" src="login-escena.jpg" alt="" aria-hidden="true" />

    <div class="marca">
      <img src="logo-qr-oscuro.svg" alt="" width="44" height="44" />
      <span class="marca-nombre">registr<b>App</b></span>
    </div>
  </aside>

  <header class="cabecera-movil">
    <img src="logo-qr-oscuro.svg" alt="" width="40" height="40" />
    <div>
      <span class="marca-nombre">registr<b>App</b></span>
      <p>Control de asistencia con código QR</p>
    </div>
  </header>

  <main class="panel-form">
    <form class="form" [formGroup]="form" (ngSubmit)="iniciarSesion()">
      <header class="form-cabecera">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Ingresa con tu cuenta para continuar.</p>
      </header>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="email" placeholder="nombre@institucion.cl" />
      </div>

      <div class="campo">
        <div class="campo-encabezado">
          <label for="password">Contraseña</label>
          <a routerLink="/recuperar" class="enlace-sutil">¿Olvidaste tu contraseña?</a>
        </div>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p-message severity="error" [text]="error()!" />
      }

      <button pButton type="submit" [loading]="cargando()" [disabled]="cargando()" class="boton-ingresar">
        Ingresar
      </button>

      <p class="pie">
        ¿Nueva institución?
        <a routerLink="/registro">Regístrala aquí</a>
      </p>
    </form>
  </main>
</div>
