<div class="pagina">
  <app-navbar titulo="Registrapp" />

  <main class="inicio">
    @if (!cargando() && usuario; as u) {
      <h1>Hola, {{ u.nombre_completo }}</h1>
      <p class="grupo">
        {{ terminologia.grupo() }}: <strong>{{ nombreGrupo() ?? 'Sin asignar' }}</strong>
      </p>

      <div class="acciones">
        <a routerLink="/miembro/escanear" class="tarjeta-accion">
          <i class="pi pi-qrcode"></i>
          <span>Escanear código QR</span>
        </a>
        <a routerLink="/miembro/historial" class="tarjeta-accion">
          <i class="pi pi-calendar"></i>
          <span>Mi historial</span>
        </a>
      </div>
    }
  </main>
</div>
